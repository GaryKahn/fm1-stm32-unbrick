# The link to the board: SEGGER RTT channel 0 as TCP port 19021 (what tools/stm32_recover.py talks to).
# Flash the firmware first, then run from the repository root and leave it running:
#   openocd -f board/stm32f4discovery.cfg -f tools/openocd/rtt.cfg
init
rtt setup 0x20000000 0x20000 "SEGGER RTT"
rtt start
rtt polling_interval 1
rtt server start 19021 0
